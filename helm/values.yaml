nameOverride: #{ServiceName}

fullnameOverride: ""

deploymentLane: NOTE-THIS-WILL-BE-REPLACED-BY-CICD

valuesYaml: values.yaml

image:
  repository: NOTE-THIS-WILL-BE-REPLACED-BY-CICD
  tag: NOTE-THIS-WILL-BE-REPLACED-BY-CICD
  pullPolicy: IfNotPresent

service:
  type: NodePort
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80

localDeployment: false

# livenessProbeSettings:
#   httpGet:
#     path: /healthz
#     port: https

livenessProbeSettings: null

readinessProbeSettings:
  httpGet:
    path: #{UriPrefix}/health
    port: 80
  initialDelaySeconds: 3
  periodSeconds: 8

initContainerCommand: nil

appsettings:
  name: appsettings
  filename: appsettings.json
  mountPath: /app/

appsettingsUseNameValues: false

appsettingsValues:
  {
    "AllowedHosts": "*",
    "CircleCiApi": {
      "OrganizationId": "21a5deff-5418-4a73-9190-99cf70b861e9",
      "ApiKey": "CIRCLECIAPI__APIKEY"
    },
    "Database": {
      "ConnectionString": "DATABASE__CONNECTIONSTRING"
    },
    "FastPassApi": {
      "Url": "https://pipelines.prog-research.com",
      "ApiKey": "FASTPASSAPI__APIKEY"
    },
    "GitHubApi": {
      "LegacyOrganization": "Prog-Leasing-LLC-Legacy",
      "User": "GITHUBAPI__USER",
      "Password": "GITHUBAPI__PASSWORD"
    },
    "JiraApi": {
      "Url": "https://progfin.atlassian.net/rest",
      "User": "JIRAAPI__USER",
      "Password": "JIRAAPI__PASSWORD"
    },
    "Logging": {
      "LogLevel": {
        "Default": "Information",
        "Microsoft.AspNetCore": "Warning"
      }
    },
    "ProcessingOptions": {
      "GatherRepoMetrics": false,
      "GatherTicketMetrics": false,
      "GatherCircleCiMetrics": true
    }
  }


imagePullSecrets:
  - name: aws-artifactory

awsParameterPrefix: fastpassreports

certificates: true

certificateFiles:
  - name: stormwind-ca
    parameterStoreFile: /certificateFiles/STORMWIND-PFPRDD1CA01-CA.pem
    mountPath: /etc/ssl/certs/
    mountFilename: stormwind.local.pem
    localCertificateFile: stormwind.local.pem

