ingress:
  enabled: true
  internal: true
  external: false
  healthCheckPath: #{UriPrefix}/health
  paths:
    - path: #{UriPrefix}
      pathType: Prefix

replicaCount: #{ReplicaCount}

podAnnotations: {}

podSecurityContext: {}

limits:
  cpu: 200m
  memory: 750Mi
requests:
  cpu: 100m
  memory: 750Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations:
- key: "network"
  operator: "Equal"
  value: "private"
  effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: network
            operator: In
            values:
              - private

# Cause deployments to remove old replica sets - default is 10 if commented out. Use "0" for Zero value
revisionHistoryLimit: "0"
